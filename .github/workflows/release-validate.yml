name: Release validation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build environment
        required: true
        type: choice
        options:
          - staging
          - production
      rc_label:
        description: Optional rc.N label; leave empty for final validation
        required: false
        type: string

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - name: Resolve dependencies
        shell: bash
        run: flutter pub get
      - name: Validate public configuration presence
        if: inputs.environment == 'production'
        shell: bash
        env:
          APP_ENV: ${{ inputs.environment }}
          APP_BACKEND_MODE: supabase
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: dart run tool/release_validation_cli.dart production-config
      - name: Build Web validation output
        shell: bash
        env:
          APP_ENV: ${{ inputs.environment }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: >-
          flutter build web --release
          --dart-define=APP_ENV="$APP_ENV"
          --dart-define=APP_BACKEND_MODE=supabase
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Validate Web package input
        shell: bash
        run: dart run tool/release_validation_cli.dart package-input --platform=web --path=build/web
      - name: Upload Web RC validation artifact
        if: inputs.rc_label != ''
        uses: actions/upload-artifact@v4
        with:
          name: web-validation-${{ inputs.environment }}
          path: build/web
          retention-days: 14
      - name: Upload Web final validation artifact
        if: inputs.rc_label == ''
        uses: actions/upload-artifact@v4
        with:
          name: web-validation-${{ inputs.environment }}
          path: build/web
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - name: Resolve dependencies
        shell: pwsh
        run: flutter pub get
      - name: Build Windows validation output
        shell: pwsh
        env:
          APP_ENV: ${{ inputs.environment }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          flutter build windows --release `
            "--dart-define=APP_ENV=$env:APP_ENV" `
            "--dart-define=APP_BACKEND_MODE=supabase" `
            "--dart-define=SUPABASE_URL=$env:SUPABASE_URL" `
            "--dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY"
      - name: Validate Windows package input
        shell: pwsh
        run: dart run tool/release_validation_cli.dart package-input --platform=windows-x64 --path=build/windows/x64/runner/Release
      - name: Upload Windows RC validation artifact
        if: inputs.rc_label != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-${{ inputs.environment }}
          path: build/windows/x64/runner/Release
          retention-days: 14
      - name: Upload Windows final validation artifact
        if: inputs.rc_label == ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-${{ inputs.environment }}
          path: build/windows/x64/runner/Release
          retention-days: 30

  android-production:
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - name: Require protected signing setup
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Materialize temporary keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-signing/upload.jks"
      - name: Build signed production AAB validation output
        shell: bash
        env:
          RELEASE_SIGNING_SOURCE: ci
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/upload.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: >-
          flutter build appbundle --release
          --dart-define=APP_ENV=production
          --dart-define=APP_BACKEND_MODE=supabase
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Upload Android RC validation artifact
        if: inputs.rc_label != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-production-validation
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 14
      - name: Upload Android final validation artifact
        if: inputs.rc_label == ''
        uses: actions/upload-artifact@v4
        with:
          name: android-production-validation
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/android-signing"
